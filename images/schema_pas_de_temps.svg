<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" font-family="Helvetica, Arial, sans-serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
 <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
 <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
 <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#888" stroke-width="1.5"/></pattern>
</defs>
<rect width="880" height="700" fill="white"/>
<rect x="150" y="20" width="420" height="70" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.8"/>
<text x="360.0" y="44.0" fill="#222" font-size="16" text-anchor="middle" font-weight="bold">Initialisation</text>
<text x="360.0" y="66.0" fill="#222" font-size="14" text-anchor="middle" >particules, parois, paramètres, Δt</text>
<text x="360.0" y="86.0" fill="#222" font-size="14" text-anchor="middle" >voisins + calcul des forces F(0)</text>
<line x1="360.0" y1="90.0" x2="360.0" y2="118.0" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="150" y="120" width="420" height="72" rx="8" fill="#e8eef7" stroke="#1f5fa8" stroke-width="1.8"/>
<text x="360.0" y="144.0" fill="#222" font-size="16" text-anchor="middle" font-weight="bold">1. Demi-pas sur les vitesses, pas sur les positions</text>
<text x="250.0" y="166.0" fill="#222" font-size="14" text-anchor="start" >v ← v + (Δt/2) F/m</text>
<text x="420.0" y="166.0" fill="#222" font-size="14" text-anchor="start" >ω ← ω + (Δt/2) T/I</text>
<text x="250.0" y="186.0" fill="#222" font-size="14" text-anchor="start" >x ← x + Δt v</text>
<text x="420.0" y="186.0" fill="#222" font-size="14" text-anchor="start" >θ ← θ + Δt ω</text>
<line x1="360.0" y1="192.0" x2="360.0" y2="220.0" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="150" y="222" width="420" height="72" rx="8" fill="#e8eef7" stroke="#1f5fa8" stroke-width="1.8"/>
<text x="360.0" y="246.0" fill="#222" font-size="16" text-anchor="middle" font-weight="bold">2. Mise à jour des voisins (si nécessaire)</text>
<text x="360.0" y="268.0" fill="#222" font-size="14" text-anchor="middle" >reconstruction de la liste de Verlet si un grain</text>
<text x="360.0" y="288.0" fill="#222" font-size="14" text-anchor="middle" >s'est déplacé de plus de D_Verlet / 2</text>
<line x1="360.0" y1="294.0" x2="360.0" y2="322.0" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="150" y="324" width="420" height="92" rx="8" fill="#e8eef7" stroke="#1f5fa8" stroke-width="1.8"/>
<text x="360.0" y="348.0" fill="#222" font-size="16" text-anchor="middle" font-weight="bold">3. Calcul des forces au temps t + Δt</text>
<text x="360.0" y="370.0" fill="#222" font-size="14" text-anchor="middle" >F ← m g,  T ← 0</text>
<text x="360.0" y="390.0" fill="#222" font-size="14" text-anchor="middle" >pour chaque interaction : δn, n, v_rel → fn, ft</text>
<text x="360.0" y="410.0" fill="#222" font-size="14" text-anchor="middle" >F_i += f,  F_j −= f  (et moments)</text>
<line x1="360.0" y1="416.0" x2="360.0" y2="444.0" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="150" y="446" width="420" height="52" rx="8" fill="#e8eef7" stroke="#1f5fa8" stroke-width="1.8"/>
<text x="360.0" y="470.0" fill="#222" font-size="16" text-anchor="middle" font-weight="bold">4. Second demi-pas sur les vitesses</text>
<text x="250.0" y="492.0" fill="#222" font-size="14" text-anchor="start" >v ← v + (Δt/2) F/m</text>
<text x="420.0" y="492.0" fill="#222" font-size="14" text-anchor="start" >ω ← ω + (Δt/2) T/I</text>
<line x1="360.0" y1="498.0" x2="360.0" y2="526.0" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="150" y="528" width="420" height="52" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.8"/>
<text x="360.0" y="552.0" fill="#222" font-size="16" text-anchor="middle" font-weight="bold">5. Sorties (tous les n pas)</text>
<text x="360.0" y="574.0" fill="#222" font-size="14" text-anchor="middle" >images, énergies, mesures</text>
<line x1="360.0" y1="580.0" x2="360.0" y2="606.0" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<polygon points="360,608 440,640 360,672 280,640" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="360.0" y="645.0" fill="#222" font-size="14" text-anchor="middle" >t &lt; t_end ?</text>
<text x="450.0" y="660.0" fill="#222" font-size="14" text-anchor="start" >non → fin</text>
<polyline points="280,640 90,640 90,156 146,156" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="100.0" y="400.0" fill="#222" font-size="14" text-anchor="middle" transform="rotate(-90 100 400)">oui : t ← t + Δt</text>
<line x1="574" y1="50" x2="598" y2="50" stroke="#1f5fa8" stroke-width="1.2" stroke-dasharray="3 3"/><text x="604.0" y="46.0" fill="#1f5fa8" font-size="13" text-anchor="start" font-weight="bold">mise en données</text>
<text x="604.0" y="63.0" fill="#222" font-size="12.5" text-anchor="start" >étapes 1 à 4</text>
<line x1="574" y1="150" x2="598" y2="150" stroke="#1f5fa8" stroke-width="1.2" stroke-dasharray="3 3"/><text x="604.0" y="146.0" fill="#1f5fa8" font-size="13" text-anchor="start" font-weight="bold">intégration en temps</text>
<text x="604.0" y="163.0" fill="#222" font-size="12.5" text-anchor="start" >étape 1 : translation</text>
<text x="604.0" y="179.0" fill="#222" font-size="12.5" text-anchor="start" >étape 5 : rotation (θ, ω)</text>
<line x1="574" y1="252" x2="598" y2="252" stroke="#1f5fa8" stroke-width="1.2" stroke-dasharray="3 3"/><text x="604.0" y="248.0" fill="#1f5fa8" font-size="13" text-anchor="start" font-weight="bold">voisins</text>
<text x="604.0" y="265.0" fill="#222" font-size="12.5" text-anchor="start" >étape 5 : liste refaite à chaque pas</text>
<text x="604.0" y="281.0" fill="#222" font-size="12.5" text-anchor="start" >étape 6 : liste de Verlet, OBB</text>
<text x="604.0" y="297.0" fill="#222" font-size="12.5" text-anchor="start" >étape 7 : grille de cellules</text>
<line x1="574" y1="352" x2="598" y2="352" stroke="#1f5fa8" stroke-width="1.2" stroke-dasharray="3 3"/><text x="604.0" y="348.0" fill="#1f5fa8" font-size="13" text-anchor="start" font-weight="bold">loi de contact</text>
<text x="604.0" y="365.0" fill="#222" font-size="12.5" text-anchor="start" >étape 2 : contact avec le sol</text>
<text x="604.0" y="381.0" fill="#222" font-size="12.5" text-anchor="start" >étape 3 : contact entre disques</text>
<text x="604.0" y="397.0" fill="#222" font-size="12.5" text-anchor="start" >étape 4 : parois</text>
<text x="604.0" y="413.0" fill="#222" font-size="12.5" text-anchor="start" >étape 5 : frottement, roulement</text>
<line x1="574" y1="466" x2="598" y2="466" stroke="#1f5fa8" stroke-width="1.2" stroke-dasharray="3 3"/><text x="604.0" y="462.0" fill="#1f5fa8" font-size="13" text-anchor="start" font-weight="bold">intégration en temps</text>
<text x="604.0" y="479.0" fill="#222" font-size="12.5" text-anchor="start" >étape 1 (rotation : étape 5)</text>
<line x1="574" y1="548" x2="598" y2="548" stroke="#1f5fa8" stroke-width="1.2" stroke-dasharray="3 3"/><text x="604.0" y="544.0" fill="#1f5fa8" font-size="13" text-anchor="start" font-weight="bold">sorties</text>
<text x="604.0" y="561.0" fill="#222" font-size="12.5" text-anchor="start" >étape 3 : visualisation</text>
<text x="604.0" y="577.0" fill="#222" font-size="12.5" text-anchor="start" >étape 4 : bilan d'énergie</text>

